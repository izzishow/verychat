<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VeryChat - Real-time Cloud Chat</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="theme-default">
  <div class="chat-container" id="drop-zone">
    <!-- Header -->
    <header class="chat-header">
      <div class="brand">
        <div class="logo">⚡</div>
        <div>
          <h1>VeryChat</h1>
          <span class="status-badge"><span class="dot"></span> Live on VeryCloud</span>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" id="theme-btn" class="header-icon-btn" title="배경화면 / 테마 설정">🎨</button>
        <input type="text" id="username-input" placeholder="닉네임 설정..." value="사용자1" />
      </div>
    </header>

    <!-- Message Area -->
    <main class="messages-container" id="messages-container">
      <!-- Messages rendered dynamically -->
    </main>

    <!-- File Upload Preview Bar -->
    <div class="file-preview-bar" id="file-preview-bar" style="display: none;">
      <div class="preview-item">
        <img id="preview-img" src="" alt="미리보기" style="display: none;" />
        <video id="preview-video" style="display: none;" muted></video>
        <div id="preview-file-icon" class="preview-file-badge" style="display: none;">📄</div>
        <button type="button" id="remove-preview-btn" title="첨부 취소">&times;</button>
      </div>
      <div class="preview-details">
        <span class="preview-filename" id="preview-filename"></span>
        <span class="preview-filesize" id="preview-filesize"></span>
      </div>
    </div>

    <!-- Input Bar -->
    <footer class="input-area">
      <form id="chat-form">
        <!-- Hidden file input for all attachments -->
        <input
          type="file"
          id="file-input"
          accept="image/*,video/*,text/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.json,.csv,.log,.md"
          style="display: none;"
        />

        <!-- Attachment Button -->
        <button type="button" id="attach-btn" class="icon-btn" title="파일 첨부 (사진, 동영상, 텍스트 문서 등)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
          </svg>
        </button>

        <!-- Text Input -->
        <input
          type="text"
          id="message-input"
          placeholder="메시지 입력 (사진, 동영상, 파일 드래그/붙여넣기 지원)..."
          autocomplete="off"
        />

        <!-- Send Button -->
        <button type="submit" id="send-btn">
          <span>전송</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </footer>

    <!-- Drop overlay -->
    <div class="drop-overlay" id="drop-overlay">
      <div class="drop-text">📁 사진, 동영상, 파일을 여기에 놓으세요</div>
    </div>
  </div>

  <!-- Theme / Background Settings Modal -->
  <div class="theme-modal" id="theme-modal">
    <div class="theme-modal-card">
      <div class="theme-modal-header">
        <h3>🎨 배경화면 및 테마 설정</h3>
        <button type="button" class="modal-close-btn" id="theme-close-btn">&times;</button>
      </div>

      <div class="theme-section">
        <h4>추천 컬러 테마</h4>
        <div class="theme-grid">
          <button type="button" class="theme-option" data-theme="default">
            <span class="theme-swatch swatch-default"></span>
            <span>네뷸라 블루</span>
          </button>
          <button type="button" class="theme-option" data-theme="cyberpunk">
            <span class="theme-swatch swatch-cyberpunk"></span>
            <span>사이버펑크</span>
          </button>
          <button type="button" class="theme-option" data-theme="sunset">
            <span class="theme-swatch swatch-sunset"></span>
            <span>선셋 글로우</span>
          </button>
          <button type="button" class="theme-option" data-theme="emerald">
            <span class="theme-swatch swatch-emerald"></span>
            <span>에메랄드</span>
          </button>
          <button type="button" class="theme-option" data-theme="oled">
            <span class="theme-swatch swatch-oled"></span>
            <span>OLED 블랙</span>
          </button>
        </div>
      </div>

      <div class="theme-section">
        <h4>내 이미지로 배경화면 설정</h4>
        <div class="custom-bg-actions">
          <input type="file" id="custom-bg-input" accept="image/*" style="display: none;" />
          <button type="button" id="upload-bg-btn" class="btn-secondary">🖼️ 사진 선택하기</button>
          <button type="button" id="reset-bg-btn" class="btn-text">기본 배경으로 초기화</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Lightbox Modal for Images -->
  <div class="lightbox-modal" id="lightbox-modal">
    <span class="lightbox-close" id="lightbox-close">&times;</span>
    <img class="lightbox-content" id="lightbox-img" alt="크게 보기" />
  </div>

  <script src="app.js"></script>
</body>
</html>
