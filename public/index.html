<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VeryChat - Real-time Cloud Chat</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="chat-container">
    <!-- Header -->
    <header class="chat-header">
      <div class="brand">
        <div class="logo">⚡</div>
        <div>
          <h1>VeryChat</h1>
          <span class="status-badge"><span class="dot"></span> Live on VeryCloud</span>
        </div>
      </div>
      <div class="header-actions">
        <input type="text" id="username-input" placeholder="닉네임 설정..." value="사용자1" />
      </div>
    </header>

    <!-- Message Area -->
    <main class="messages-container" id="messages-container">
      <!-- Messages rendered dynamically -->
    </main>

    <!-- Input Bar -->
    <footer class="input-area">
      <form id="chat-form">
        <input
          type="text"
          id="message-input"
          placeholder="메시지를 입력하세요 (Enter로 전송)..."
          autocomplete="off"
        />
        <button type="submit" id="send-btn">
          <span>전송</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
